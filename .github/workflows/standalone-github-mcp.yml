name: Standalone GitHub MCP checks

on:
  pull_request:
    paths:
      - "standalone-github-mcp/**"
      - ".github/workflows/standalone-github-mcp.yml"
  push:
    branches: [main]
    paths:
      - "standalone-github-mcp/**"
      - ".github/workflows/standalone-github-mcp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone-github-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: standalone-github-mcp/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
