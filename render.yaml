services:
  - type: web
    name: cue-github-mcp
    runtime: docker
    repo: https://github.com/rajeevranjan4348-arch/manus-remix
    branch: feat/github-mcp-server-production
    rootDir: standalone-github-mcp
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_ENABLE_WRITE_TOOLS
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: eternal-envoy-cnzsc
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MCP_ALLOWED_FIREBASE_UIDS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_ALLOWED_REPOS
        value: rajeevranjan4348-arch/manus-remix
      - key: MCP_ALLOWED_ORIGINS
        value: ""
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: MCP_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: MCP_MAX_SESSIONS
        value: "50"
      - key: MCP_SESSION_TTL_MS
        value: "1800000"
