<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Mono:ital,wght@0,100..700;1,100..700&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manus AI Agent Clone</title>
    <meta name="description" content="Autonomous AI agent workspace with multi-step reasoning, research, data analysis, and live preview." />
    <meta property="og:title" content="Manus AI Agent Clone" />
    <meta property="og:description" content="Autonomous AI agent workspace with multi-step reasoning, research, data analysis, and live preview." />
    <script>
      // Defensive fallback to ensure window.fetch can be modified without getter-only errors
      try {
        const _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
        let _activeFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _activeFetch;
          },
          set(fn) {
            _activeFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Ignore if already configurable
      }

      // Filter out Blink cloud domain origin rejection errors from console.error
      try {
        const _origError = console.error.bind(console);
        console.error = function(...args) {
          if (
            typeof args[0] === 'string' &&
            (args[0].includes('[Agent] stream failed') || args[0].includes('did not accept a request from'))
          ) {
            console.warn(...args);
            return;
          }
          _origError(...args);
        };
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
