[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/image-generation"
  to = "/.netlify/functions/image-generation"
  status = 200

[[redirects]]
  from = "/api/gemini/image"
  to = "/.netlify/functions/image-generation"
  status = 200

[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/agent/status"
  to = "/.netlify/functions/agent-status"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/web-search"
  to = "/.netlify/functions/web-search"
  status = 200

[[redirects]]
  from = "/api/visual-search"
  to = "/.netlify/functions/web-search"
  status = 200

[[redirects]]
  from = "/api/realtime*"
  to = "/.netlify/functions/realtime"
  status = 200

[[redirects]]
  from = "/api/rtie/*"
  to = "/.netlify/functions/realtime"
  status = 200

[[redirects]]
  from = "/api/permissions/*"
  to = "/.netlify/functions/permissions"
  status = 200

[[redirects]]
  from = "/api/checkpoints/*"
  to = "/.netlify/functions/checkpoints"
  status = 200

[[redirects]]
  from = "/api/workspace/integrations"
  to = "/.netlify/functions/workspace-integrations"
  status = 200

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200

[[redirects]]
  from = "/api/sandbox/*"
  to = "/.netlify/functions/sandbox"
  status = 200

[[redirects]]
  from = "/api/browser/*"
  to = "/.netlify/functions/browser"
  status = 200

[[redirects]]
  from = "/api/tasks/*"
  to = "/.netlify/functions/tasks"
  status = 200

[[redirects]]
  from = "/api/multi-agent/*"
  to = "/.netlify/functions/multi-agent"
  status = 200

[[redirects]]
  from = "/api/skills/*"
  to = "/.netlify/functions/skills"
  status = 200

[[redirects]]
  from = "/api/scheduler/*"
  to = "/.netlify/functions/scheduler"
  status = 200

[[redirects]]
  from = "/api/rag/*"
  to = "/.netlify/functions/rag"
  status = 200

[[redirects]]
  from = "/api/webhooks/*"
  to = "/.netlify/functions/webhooks"
  status = 200

[[redirects]]
  from = "/api/mcp/*"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/sync/*"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), display-capture=(self)"
    Content-Security-Policy = "default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: http: wss: ws:; frame-ancestors *;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
