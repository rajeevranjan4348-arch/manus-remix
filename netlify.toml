[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/tag-task"
  to = "/.netlify/functions/tag-task"
  status = 200

[[redirects]]
  from = "/api/gemini/tag-task"
  to = "/.netlify/functions/tag-task"
  status = 200

[[redirects]]
  from = "/api/summarize-session"
  to = "/.netlify/functions/summarize-session"
  status = 200

[[redirects]]
  from = "/api/gemini/summarize-session"
  to = "/.netlify/functions/summarize-session"
  status = 200

[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/agent/status"
  to = "/.netlify/functions/agent-status"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/web-search"
  to = "/.netlify/functions/web-search"
  status = 200

[[redirects]]
  from = "/api/visual-search"
  to = "/.netlify/functions/web-search"
  status = 200

[[redirects]]
  from = "/api/realtime*"
  to = "/.netlify/functions/realtime"
  status = 200

[[redirects]]
  from = "/api/rtie/*"
  to = "/.netlify/functions/realtime"
  status = 200

[[redirects]]
  from = "/api/permissions/*"
  to = "/.netlify/functions/permissions"
  status = 200

[[redirects]]
  from = "/api/checkpoints/*"
  to = "/.netlify/functions/checkpoints"
  status = 200

[[redirects]]
  from = "/api/workspace/integrations"
  to = "/.netlify/functions/workspace-integrations"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    Content-Security-Policy = "default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: http: wss: ws:; frame-ancestors *;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
