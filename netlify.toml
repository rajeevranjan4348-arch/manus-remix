[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/agent/status"
  to = "/.netlify/functions/agent-status"
  status = 200

[[redirects]]
  from = "/api/image-generation"
  to = "/.netlify/functions/image-generation"
  status = 200

[[redirects]]
  from = "/api/web-search"
  to = "/.netlify/functions/web-search"
  status = 200

[[redirects]]
  from = "/api/permissions/*"
  to = "/.netlify/functions/permissions"
  status = 200

[[redirects]]
  from = "/api/checkpoints/*"
  to = "/.netlify/functions/checkpoints"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; frame-ancestors 'self' https://*.google.com https://*.run.app;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

