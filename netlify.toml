[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200

[[redirects]]
  from = "/api/github/*"
  to = "/.netlify/functions/github/:splat"
  status = 200

[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
