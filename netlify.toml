[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/iris"
  to = "/.netlify/functions/iris"
  status = 200
  force = true

[[redirects]]
  from = "/api/iris/*"
  to = "/.netlify/functions/iris"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
